name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm test

      - name: Lighthouse (performance, accessibility, best practices and SEO budgets)
        run: npm run lighthouse

      - name: Upload test and Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          retention-days: 7

      - name: Keep the tested build for deployment
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/adlouniahmad-portfolio/browser
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
