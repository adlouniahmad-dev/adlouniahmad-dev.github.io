<div class="spotlight" aria-hidden="true"></div>

<!-- small screens only: the sidebar menu is hidden there -->
<div class="mobile-bar">
	<a class="bar-logo" href="#" (click)="scrollToTop($event)" aria-label="Back to top">
		<adl-logo></adl-logo>
	</a>
	<adl-navigation variant="bar"></adl-navigation>
</div>

<div class="main position-relative">
	<div class="d-flex flex-column flex-lg-row justify-content-between gap-3">

		<header class="header d-flex flex-column justify-content-between">
			<div class="enter">
				<span class="eyebrow">
					<span class="pulse" aria-hidden="true"></span>
					Hello there, I'm
				</span>
				<h1 class="name">{{ info.name }}</h1>
				<p class="role">
					<span class="gradient-text">{{ info.position }}</span><span class="caret" aria-hidden="true"></span>
				</p>
				<adl-navigation class="navigation-container"></adl-navigation>
			</div>
			<adl-footer class="mt-4 enter enter-delay"></adl-footer>
		</header>

		<main class="content">
			<adl-about data-aos="fade-left"></adl-about>
			<adl-experiences></adl-experiences>
			<adl-portfolio></adl-portfolio>
			<adl-contact></adl-contact>
		</main>

	</div>
</div>
